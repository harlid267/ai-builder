<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Конструктор</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --border:#2a303c;
  --text:#e8eaf0; --muted:#9aa3b2; --accent:#4f8cff; --accent2:#3a6fd8;
  --user:#2f4a7d; --err:#7d2f2f;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Roboto','Segoe UI',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; overflow:hidden;
}
header{
  display:flex; align-items:center; gap:12px;
  padding:14px 18px; background:var(--panel); border-bottom:1px solid var(--border);
}
header h1{font-size:22px; font-weight:600; flex:1}
button{font-family:inherit}
.btn{
  background:var(--panel2); color:var(--text); border:1px solid var(--border);
  border-radius:var(--radius); font-size:18px; min-height:52px; padding:10px 20px;
  cursor:pointer; transition:background .15s; white-space:nowrap;
}
.btn:hover{background:#262c38}
.btn.primary{background:var(--accent); border-color:var(--accent); font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn:disabled{opacity:.5; cursor:default}
main{flex:1; display:grid; grid-template-columns:1fr 1fr; min-height:0}
section{display:flex; flex-direction:column; min-height:0}
#chatPane{border-right:1px solid var(--border)}
.pane-head{
  display:flex; align-items:center; gap:10px; padding:10px 16px;
  background:var(--panel); border-bottom:1px solid var(--border);
  font-size:17px; color:var(--muted);
}
.pane-head .title{flex:1}
.pane-head .btn{min-height:44px; padding:6px 16px; font-size:16px}
#messages{
  flex:1; overflow-y:auto; padding:16px;
  display:flex; flex-direction:column; gap:12px;
}
.msg{
  max-width:92%; padding:14px 16px; border-radius:var(--radius);
  font-size:17px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word;
}
.msg.user{align-self:flex-end; background:var(--user)}
.msg.bot{align-self:flex-start; background:var(--panel2); border:1px solid var(--border)}
.msg.err{align-self:flex-start; background:var(--err); border:1px solid #b45252}
.msg.sysinfo{
  align-self:center; color:var(--muted); font-size:15px; background:transparent;
  border:1px dashed var(--border); padding:8px 14px;
}
.msg details{margin-top:10px}
.msg summary{cursor:pointer; color:var(--accent); font-size:15px}
.msg pre{
  margin-top:8px; background:#0c0e12; border:1px solid var(--border);
  border-radius:8px; padding:10px; overflow:auto; max-height:240px;
  font-size:13px; color:#c9d3e3; white-space:pre;
}
.typing{align-self:flex-start; color:var(--muted); font-style:italic; font-size:16px; padding:4px 8px}
.composer{
  display:flex; gap:12px; padding:14px 16px;
  background:var(--panel); border-top:1px solid var(--border);
}
textarea#prompt{
  flex:1; resize:none; background:var(--panel2); color:var(--text);
  border:1px solid var(--border); border-radius:var(--radius);
  font-size:18px; padding:14px; min-height:56px; max-height:160px;
  font-family:inherit; outline:none;
}
textarea#prompt:focus{border-color:var(--accent)}
.composer .btn{align-self:stretch}
#preview{flex:1; width:100%; background:#fff; border:0; display:none}
.preview-empty{
  flex:1; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:18px; text-align:center; padding:20px; white-space:pre-line;
}
#overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:40}
#overlay.show{display:block}
#settings{
  position:fixed; top:0; right:0; bottom:0; width:min(430px,100%);
  background:var(--panel); border-left:1px solid var(--border); z-index:50;
  transform:translateX(100%); transition:transform .2s ease;
  display:flex; flex-direction:column; gap:14px; padding:20px; overflow-y:auto;
}
#settings.show{transform:translateX(0)}
#settings h2{font-size:22px; margin-bottom:4px}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:16px; color:var(--muted)}
.field input, .field select{
  background:var(--panel2); color:var(--text); border:1px solid var(--border);
  border-radius:10px; font-size:17px; padding:12px 14px; font-family:inherit; outline:none; width:100%;
}
.field input:focus, .field select:focus{border-color:var(--accent)}
.field .row{display:flex; gap:8px}
.field .row input{flex:1}
.field .row .btn{min-height:48px; padding:6px 14px; font-size:16px}
.hint{font-size:14px; color:var(--muted); line-height:1.45}
#settings .btn.primary{margin-top:8px}
@media (max-width:820px){
  main{grid-template-columns:1fr; grid-template-rows:1fr 1fr}
  #chatPane{border-right:0; border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>

<header>
  <h1>AI Конструктор</h1>
  <button class="btn" id="clearBtn" title="Очистить чат и проект">🧹 Очистить</button>
  <button class="btn" id="settingsBtn" title="Настройки">⚙️ Настройки</button>
</header>

<main>
  <section id="chatPane">
    <div class="pane-head"><span class="title">💬 Чат с ИИ</span></div>
    <div id="messages"></div>
    <div class="composer">
      <textarea id="prompt" rows="2" placeholder="Опишите приложение, например: «Сделай калькулятор»"></textarea>
      <button class="btn primary" id="sendBtn">➤ Отправить</button>
    </div>
  </section>

  <section id="previewPane">
    <div class="pane-head">
      <span class="title">🖥 Предпросмотр</span>
      <button class="btn" id="reloadBtn" title="Перезагрузить предпросмотр">🔄 Обновить</button>
      <button class="btn" id="downloadBtn" title="Сохранить HTML-файл">⬇️ Скачать</button>
    </div>
    <div class="preview-empty" id="previewEmpty">Здесь появится результат.
Опишите приложение слева —
например: «Сделай калькулятор».</div>
    <iframe id="preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
  </section>
</main>

<div id="overlay"></div>

<aside id="settings">
  <h2>⚙️ Настройки</h2>

  <div class="field">
    <label for="provider">Провайдер</label>
    <select id="provider">
      <option value="claude">Claude (api.anthropic.com)</option>
      <option value="openai">OpenAI (api.openai.com)</option>
      <option value="custom">Другой (OpenAI-совместимый)</option>
    </select>
  </div>

  <div class="field">
    <label for="apiKey">API-ключ</label>
    <div class="row">
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…">
      <button class="btn" id="showKeyBtn" title="Показать/скрыть ключ">👁</button>
    </div>
    <div class="hint">Хранится только в этом приложении (localStorage).</div>
  </div>

  <div class="field">
    <label for="model">Модель</label>
    <input id="model" type="text" placeholder="claude-sonnet-4-5" autocomplete="off">
  </div>

  <div class="field">
    <label for="baseUrl">Base URL</label>
    <input id="baseUrl" type="text" autocomplete="off">
    <div class="hint" id="baseUrlHint"></div>
  </div>

  <button class="btn primary" id="saveSettingsBtn">💾 Сохранить настройки</button>
  <button class="btn" id="closeSettingsBtn">Закрыть</button>
</aside>

<script>
'use strict';

var LS_SETTINGS = 'aic_settings';
var LS_MESSAGES = 'aic_messages';
var LS_HTML = 'aic_html';

var PROVIDER_DEFAULTS = {
  claude:  { baseUrl: 'https://api.anthropic.com',   model: 'claude-sonnet-4-5', hint: 'Обычно https://api.anthropic.com. К запросу добавится /v1/messages.' },
  openai:  { baseUrl: 'https://api.openai.com/v1',   model: 'gpt-4o-mini',       hint: 'Обычно https://api.openai.com/v1. К запросу добавится /chat/completions.' },
  custom:  { baseUrl: '',                            model: '',                  hint: 'Например: https://хост/v1 или http://192.168.1.5:1234/v1.' }
};

var SYSTEM_PROMPT = [
  'Ты — генератор веб-приложений внутри Android-приложения «AI Конструктор».',
  'Пользователь описывает приложение, а ты создаёшь его как ОДИН полный самодостаточный HTML-файл',
  '(HTML + CSS + JavaScript внутри одного файла, без внешних зависимостей и CDN).',
  'Отвечай всегда по-русски.',
  'Правила:',
  '1. Возвращай ПОЛНЫЙ HTML-код в одном блоке кода ```html ... ```.',
  '2. Даже при просьбе внести правки выдавай целиком обновлённый файл, а не фрагменты.',
  '3. Код должен работать сразу при открытии в iframe (разрешены скрипты, формы, модальные окна).',
  '4. Делай аккуратный современный дизайн и полностью рабочий интерактив.',
  '5. Кратко опиши, что сделано или изменено, до или после блока кода.'
].join('\n');

var settings = loadSettings();
var messages = loadMessages();
var currentHtml = localStorage.getItem(LS_HTML) || '';
var busy = false;

var promptEl = document.getElementById('prompt');
var sendBtn = document.getElementById('sendBtn');
var messagesEl = document.getElementById('messages');
var iframeEl = document.getElementById('preview');
var previewEmptyEl = document.getElementById('previewEmpty');
var settingsEl = document.getElementById('settings');
var overlayEl = document.getElementById('overlay');

function loadSettings() {
  var s = {};
  try { s = JSON.parse(localStorage.getItem(LS_SETTINGS) || '{}') || {}; } catch (e) { s = {}; }
  return {
    provider: s.provider || 'claude',
    apiKey: s.apiKey || '',
    model: s.model || '',
    baseUrl: s.baseUrl || ''
  };
}

function loadMessages() {
  try {
    var arr = JSON.parse(localStorage.getItem(LS_MESSAGES) || '[]');
    return Array.isArray(arr) ? arr.filter(function (m) {
      return m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string';
    }) : [];
  } catch (e) { return []; }
}

function saveState() {
  localStorage.setItem(LS_MESSAGES, JSON.stringify(messages));
  if (currentHtml) localStorage.setItem(LS_HTML, currentHtml);
  else localStorage.removeItem(LS_HTML);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderAssistant(text) {
  var t = escapeHtml(text);
  t = t.replace(/```(?:html|htm|webpage)?\s*\n?([\s\S]*?)```/g, function (m, code) {
    var lines = code.trim() ? code.trim().split('\n').length : 0;
    return '<details><summary>Показать/скрыть код (' + lines + ' строк)</summary><pre>' +
      escapeHtml(code.trim()) + '</pre></details>';
  });
  return t;
}

function addMessageEl(cls, html) {
  var div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = html;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addUserMessage(text) {
  addMessageEl('user', escapeHtml(text));
}

function addAssistantMessage(text) {
  addMessageEl('bot', renderAssistant(text));
}

function addSystemNote(text) {
  addMessageEl('sysinfo', escapeHtml(text));
}

function addError(text) {
  addMessageEl('err', '⚠️ ' + escapeHtml(text));
}

function addTyping() {
  return addMessageEl('typing', '⏳ Жду ответ от ИИ…');
}

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  sendBtn.textContent = v ? '… Ждём' : '➤ Отправить';
}

function extractHtml(text) {
  var blocks = [];
  var re = /```(?:html|htm|webpage)?\s*\n([\s\S]*?)```/gi;
  var m;
  while ((m = re.exec(text)) !== null) blocks.push(m[1]);

  if (!blocks.length) {
    var tail = /```(?:html)?\s*\n([\s\S]+)$/.exec(text);
    if (tail) blocks.push(tail[1]);
  }

  if (!blocks.length) {
    if (/<!doctype\s+html|<html[\s>]/i.test(text)) return text.trim();
    return null;
  }

  var htmlBlocks = blocks.filter(function (b) { return /<!doctype\s+html|<html[\s>]/i.test(b); });
  var pool = htmlBlocks.length ? htmlBlocks : blocks;
  pool.sort(function (a, b) { return b.length - a.length; });
  return pool[0].trim();
}

function updatePreview(html) {
  if (!html) return;
  currentHtml = html;
  saveState();
  iframeEl.style.display = 'block';
  previewEmptyEl.style.display = 'none';
  iframeEl.srcdoc = html;
}

function foldMessages(list) {
  var out = [];
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    if (out.length && out[out.length - 1].role === m.role) {
      out[out.length - 1].content += '\n\n' + m.content;
    } else {
      out.push({ role: m.role, content: m.content });
    }
  }
  return out;
}

function systemText() {
  var s = SYSTEM_PROMPT;
  if (currentHtml) {
    s += '\n\nТекущая версия проекта (внеси правки по просьбе пользователя и верни файл целиком):\n```html\n' + currentHtml + '\n```';
  }
  return s;
}

function errorText(data, res) {
  var t = '';
  if (data && data.error) {
    if (typeof data.error === 'string') t = data.error;
    else if (data.error.message) t = data.error.message;
  } else if (data && data.message) {
    t = data.message;
  }
  if (!t) t = 'HTTP ' + res.status;
  return String(t).slice(0, 400);
}

async function requestAI(history) {
  var sys = systemText();
  var provider = settings.provider;

  if (provider === 'claude') {
    var base = (settings.baseUrl || PROVIDER_DEFAULTS.claude.baseUrl).trim().replace(/\/+$/, '');
    var url = /\/v\d+$/.test(base) ? base + '/messages' : base + '/v1/messages';
    var res = await fetch(url, {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': settings.apiKey.trim(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: (settings.model || PROVIDER_DEFAULTS.claude.model).trim(),
        max_tokens: 8000,
        system: sys,
        messages: history
      })
    });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error('Claude API: ' + errorText(data, res));
    var parts = (data.content || []).filter(function (c) { return c && c.type === 'text'; })
      .map(function (c) { return c.text; });
    return parts.join('\n').trim();
  }

  var base2 = (settings.baseUrl || '').trim().replace(/\/+$/, '');
  if (!base2) throw new Error('Укажите Base URL в настройках.');
  var url2 = /\/v\d+$/.test(base2) ? base2 + '/chat/completions' : base2 + '/v1/chat/completions';
  var msgs = [{ role: 'system', content: sys }].concat(history);
  var res2 = await fetch(url2, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'authorization': 'Bearer ' + settings.apiKey.trim()
    },
    body: JSON.stringify({
      model: (settings.model || 'gpt-4o-mini').trim(),
      messages: msgs
    })
  });
  var data2 = await res2.json().catch(function () { return {}; });
  if (!res2.ok) throw new Error('API: ' + errorText(data2, res2));
  var ch = data2.choices && data2.choices[0];
  var content = ch && ch.message && ch.message.content;
  if (!content) throw new Error('Пустой ответ от API.');
  return String(content).trim();
}

async function send() {
  if (busy) return;
  var text = promptEl.value.trim();
  if (!text) return;

  if (!settings.apiKey.trim() && settings.provider !== 'custom') {
    openSettings();
    addError('Сначала заполните настройки: API-ключ, модель и Base URL, затем нажмите «Сохранить».');
    return;
  }

  setBusy(true);
  promptEl.value = '';
  autoGrow();
  addUserMessage(text);
  messages.push({ role: 'user', content: text });
  saveState();
  var typing = addTyping();

  try {
    var history = foldMessages(messages);
    var reply = await requestAI(history);
    messages.push({ role: 'assistant', content: reply });
    saveState();
    addAssistantMessage(reply);
    var html = extractHtml(reply);
    if (html) updatePreview(html);
    else addSystemNote('Блок с HTML-кодом не найден в ответе — попросите ИИ прислать полный файл.');
  } catch (e) {
    addError(e && e.message ? e.message : String(e));
  } finally {
    typing.remove();
    setBusy(false);
  }
}

function autoGrow() {
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
}

function openSettings() {
  fillSettingsForm();
  settingsEl.classList.add('show');
  overlayEl.classList.add('show');
}

function closeSettings() {
  settingsEl.classList.remove('show');
  overlayEl.classList.remove('show');
}

function fillSettingsForm() {
  document.getElementById('provider').value = settings.provider;
  document.getElementById('apiKey').value = settings.apiKey;
  document.getElementById('model').value = settings.model;
  document.getElementById('baseUrl').value = settings.baseUrl;
  updateBaseUrlHint();
}

function updateBaseUrlHint() {
  var p = document.getElementById('provider').value;
  document.getElementById('baseUrlHint').textContent = PROVIDER_DEFAULTS[p] ? PROVIDER_DEFAULTS[p].hint : '';
}

function saveSettingsFromForm() {
  settings.provider = document.getElementById('provider').value;
  settings.apiKey = document.getElementById('apiKey').value.trim();
  settings.model = document.getElementById('model').value.trim();
  settings.baseUrl = document.getElementById('baseUrl').value.trim();
  localStorage.setItem(LS_SETTINGS, JSON.stringify(settings));
  closeSettings();
  addSystemNote('Настройки сохранены. Провайдер: ' + settings.provider +
    (settings.model ? ', модель: ' + settings.model : '') + '.');
}

function restoreChat() {
  messagesEl.innerHTML = '';
  if (messages.length) {
    for (var i = 0; i < messages.length; i++) {
      if (messages[i].role === 'user') addUserMessage(messages[i].content);
      else addAssistantMessage(messages[i].content);
    }
  } else {
    addSystemNote('Привет! Опишите приложение, например: «Сделай калькулятор» —\nрезультат появится справа.');
  }
}

function clearAll() {
  if (!confirm('Очистить чат и текущий проект?')) return;
  messages = [];
  currentHtml = '';
  saveState();
  iframeEl.style.display = 'none';
  iframeEl.srcdoc = '';
  previewEmptyEl.style.display = 'flex';
  restoreChat();
}

document.getElementById('sendBtn').addEventListener('click', send);
promptEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
promptEl.addEventListener('input', autoGrow);
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
overlayEl.addEventListener('click', closeSettings);
document.getElementById('saveSettingsBtn').addEventListener('click', saveSettingsFromForm);
document.getElementById('provider').addEventListener('change', function () {
  var p = this.value;
  var d = PROVIDER_DEFAULTS[p];
  if (d) {
    document.getElementById('baseUrl').value = d.baseUrl;
    document.getElementById('model').value = d.model;
  }
  updateBaseUrlHint();
});
document.getElementById('showKeyBtn').addEventListener('click', function () {
  var k = document.getElementById('apiKey');
  k.type = k.type === 'password' ? 'text' : 'password';
});
document.getElementById('clearBtn').addEventListener('click', clearAll);
document.getElementById('reloadBtn').addEventListener('click', function () {
  if (currentHtml) { iframeEl.srcdoc = currentHtml; addSystemNote('Предпросмотр обновлён.'); }
});
document.getElementById('downloadBtn').addEventListener('click', function () {
  if (!currentHtml) { addSystemNote('Пока нечего сохранять — сначала создайте приложение.'); return; }
  var blob = new Blob([currentHtml], { type: 'text/html' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'app.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeSettings();
});

restoreChat();
if (currentHtml) {
  iframeEl.style.display = 'block';
  previewEmptyEl.style.display = 'none';
  iframeEl.srcdoc = currentHtml;
}
fillSettingsForm();
</script>
</body>
</html>
